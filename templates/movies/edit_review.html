{% extends "basic.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h4 class="mb-4">
                Edit Review
            </h4>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="rating">
                        Rating
                    </label>

                    <select name="rating"
                            id="rating"
                            class="form-control"
                            required>

                        <option value="5"
                            {% if review.rating == 5 %}selected{% endif %}>
                            ★★★★★ - 5
                        </option>

                        <option value="4"
                            {% if review.rating == 4 %}selected{% endif %}>
                            ★★★★☆ - 4
                        </option>

                        <option value="3"
                            {% if review.rating == 3 %}selected{% endif %}>
                            ★★★☆☆ - 3
                        </option>

                        <option value="2"
                            {% if review.rating == 2 %}selected{% endif %}>
                            ★★☆☆☆ - 2
                        </option>

                        <option value="1"
                            {% if review.rating == 1 %}selected{% endif %}>
                            ★☆☆☆☆ - 1
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="comment">
                        Your Review
                    </label>

                    <textarea name="comment"
                              id="comment"
                              class="form-control"
                              rows="4"
                              required>{{ review.comment }}</textarea>

                </div>


                <button type="submit"
                        class="btn btn-dark">

                    Update Review

                </button>


                <a href="{% url 'movie_detail' review.movie.id %}"
                   class="btn btn-secondary ml-2">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
